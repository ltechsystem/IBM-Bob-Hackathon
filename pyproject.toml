[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sentinel"
version = "0.1.0"
description = "Continuous test maintenance agent for legacy RPG on IBM i"
requires-python = ">=3.10"
dependencies = [
    "itoolkit>=1.7.0",
    "python-dotenv>=1.0.0",
    "watchdog>=4.0.0",
    "rich>=13.0.0",
    # HTTP client — used by sentinel/proposals.py to POST results to the backend
    "httpx>=0.27.0",
    # Web API backend
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    # watsonx.ai inference (optional — BACKEND_STUB=true skips it)
    "ibm-watsonx-ai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.0.0",
    "httpx>=0.27.0",   # FastAPI TestClient dependency
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*", "backend*"]

[project.scripts]
sentinel = "sentinel.__main__:main"
